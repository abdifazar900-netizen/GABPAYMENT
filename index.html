<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Web Gabung File PP</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { background: #f4f7f6; font-family: 'Segoe UI', sans-serif; }
        .card { border: none; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .header-custom { background: #8e44ad; color: white; border-radius: 15px 15px 0 0; padding: 20px; }
        .btn-merge { background: #8e44ad; color: white; border: none; padding: 12px; font-weight: bold; width: 100%; transition: 0.3s; }
        .btn-merge:hover { background: #732d91; }
        .progress { height: 25px; border-radius: 8px; margin-top: 15px; display: none; }
        #status { font-size: 0.85rem; margin-top: 10px; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center vh-100">

<div class="container" style="max-width: 650px;">
    <div class="card">
        <div class="header-custom text-center">
            <h3>Web Gabung File Payment Point</h3>
            <p class="mb-0">Gunakan Data type .xlxs</p>
        </div>
        <div class="card-body p-4">
            <div class="mb-4">
                <label class="form-label fw-bold">Silahkan Pilih File .xls min 2 fle</label>
                <input type="file" id="fileInput" class="form-control" multiple accept=".xlsx, .xls">
            </div>
            
            <button onclick="startMerge()" id="mergeBtn" class="btn btn-merge">START</button>
            
            <div class="progress" id="progressWrapper">
                <div id="progressBar" class="progress-bar progress-bar-striped progress-bar-animated bg-success" 
                     role="progressbar" style="width: 0%">0%</div>
            </div>
            
            <div id="status" class="text-center text-muted">Format Tanggal: DD/MM/YYYY HH:MM:SS</div>
        </div>
    </div>
</div>

<script>
    function formatIndoDate(dateValue) {
        if (!dateValue) return "";
        let date = new Date(dateValue);
        
        // Cek jika date valid
        if (isNaN(date.getTime())) return dateValue;

        let d = String(date.getDate()).padStart(2, '0');
        let m = String(date.getMonth() + 1).padStart(2, '0');
        let y = date.getFullYear();
        let hr = String(date.getHours()).padStart(2, '0');
        let min = String(date.getMinutes()).padStart(2, '0');
        let sec = String(date.getSeconds()).padStart(2, '0');

        return `${d}/${m}/${y} ${hr}:${min}:${sec}`;
    }

    async function startMerge() {
        const fileInput = document.getElementById('fileInput');
        const status = document.getElementById('status');
        const btn = document.getElementById('mergeBtn');
        const progressWrapper = document.getElementById('progressWrapper');
        const progressBar = document.getElementById('progressBar');
        
        const files = fileInput.files;
        if (files.length === 0) {
            alert("Pilih file terlebih dahulu!");
            return;
        }

        btn.disabled = true;
        progressWrapper.style.display = 'flex';
        let allData = [];
        
        const targetHeaders = [
            "SWITCHINGCO", "KODEDC", "KODETOKO", "PLU", 
            "TrxIDToko", "TglTransaksi", "KodeBooking", "AMOUNT", "TrxToko"
        ];

        for (let i = 0; i < files.length; i++) {
            const file = files[i];
            
            // Update Progress Bar
            let percent = Math.round(((i) / files.length) * 100);
            progressBar.style.width = percent + '%';
            progressBar.innerText = percent + '%';
            status.innerText = `Memproses (${i+1}/${files.length}): ${file.name}`;
            
            try {
                const jsonData = await readFileAsync(file);
                
                jsonData.forEach(row => {
                    let filteredRow = {};
                    targetHeaders.forEach(target => {
                        // Cari kolom dengan mengabaikan spasi dan besar/kecil huruf
                        const actualKey = Object.keys(row).find(k => 
                            k.trim().toUpperCase() === target.toUpperCase()
                        );
                        
                        let val = actualKey ? row[actualKey] : "";
                        
                        // Format khusus untuk Tanggal Transaksi
                        if (target === "TglTransaksi" && val !== "") {
                            val = formatIndoDate(val);
                        }
                        
                        filteredRow[target] = val;
                    });
                    allData.push(filteredRow);
                });
            } catch (err) {
                console.error("Error pada file:", file.name, err);
            }
        }

        // Selesai proses semua file
        progressBar.style.width = '100%';
        progressBar.innerText = '100%';
        status.innerText = "Menyusun file Excel...";

        if (allData.length > 0) {
            const ws = XLSX.utils.json_to_sheet(allData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Data_Gabungan");
            
            XLSX.writeFile(wb, "DATA_WIS_BERES" + Date.now() + ".xlsx");
            status.innerHTML = `<span class="text-success fw-bold">✅ Selesai! ${allData.length} baris digabungkan.</span>`;
        } else {
            status.innerHTML = `<span class="text-danger">❌ Tidak ada data yang ditemukan.</span>`;
        }

        btn.disabled = false;
        // Sembunyikan progress bar setelah beberapa saat
        setTimeout(() => { 
            if(allData.length > 0) progressWrapper.style.display = 'none'; 
        }, 3000);
    }

    function readFileAsync(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const data = new Uint8Array(e.target.result);
                // cellDates: true agar format tanggal di Excel terbaca sebagai objek Date JS
                const workbook = XLSX.read(data, { type: 'array', cellDates: true });
                const sheet = workbook.Sheets[workbook.SheetNames[0]];
                resolve(XLSX.utils.sheet_to_json(sheet, { defval: "" }));
            };
            reader.onerror = reject;
            reader.readAsArrayBuffer(file);
        });
    }
</script>

</body>
</html>
