<!DOCTYPE html>
<html>
<head>
    <title>Excel Merger Pro - Heavy Duty</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { background: #f4f7f6; font-family: 'Segoe UI', sans-serif; }
        .card { border: none; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .header-orange { background: #e67e22; color: white; border-radius: 15px 15px 0 0; padding: 20px; }
        .btn-merge { background: #e67e22; color: white; border: none; padding: 12px; font-weight: bold; }
        .progress { height: 25px; border-radius: 10px; display: none; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center vh-100">

<div class="container" style="max-width: 600px;">
    <div class="card text-center">
        <div class="header-orange">
            <h5 class="mb-1">EXCEL MERGER - HEAVY DUTY</h5>
            <small>Diproses satu per satu agar tidak hang</small>
        </div>
        <div class="card-body p-4 text-start">
            <div class="mb-3">
                <label class="form-label small fw-bold">Pilih File XLSX (Bisa 31+ File):</label>
                <input type="file" id="filePicker" accept=".xlsx, .xls" class="form-control" multiple>
            </div>

            <div class="progress mb-3" id="progressWrapper">
                <div id="progressBar" class="progress-bar progress-bar-striped progress-bar-animated bg-success" style="width: 0%">0%</div>
            </div>

            <button onclick="gabungkanFile()" id="btnAction" class="btn btn-merge w-100 shadow-sm mt-2">
                🚀 MULAI GABUNGKAN DATA
            </button>
            <div id="status" class="mt-3 text-center small fw-bold text-muted"></div>
        </div>
    </div>
</div>

<script>
    const allowedColumns = ["SWITCHINGCO", "KODETOKO", "PLU", "PRODDESC", "TrxIDToko", "TglTransaksi", "KodeBooking", "AMOUNT"];

    function formatDate(val) {
        if (!val) return "";
        let d;
        try {
            if (typeof val === 'number') {
                d = new Date(Math.round((val - 25569) * 86400 * 1000));
            } else {
                d = new Date(val);
            }
            if (isNaN(d.getTime())) return val;
            const pad = (n) => n.toString().padStart(2, '0');
            return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
        } catch (e) { return val; }
    }

    async function gabungkanFile() {
        const fileInput = document.getElementById('filePicker');
        const files = fileInput.files;
        if (files.length === 0) return alert("Pilih file dulu Pak!");

        const btn = document.getElementById('btnAction');
        const status = document.getElementById('status');
        const progressWrapper = document.getElementById('progressWrapper');
        const progressBar = document.getElementById('progressBar');

        // Reset UI
        btn.disabled = true;
        progressWrapper.style.display = 'flex';
        let allData = [];

        for (let i = 0; i < files.length; i++) {
            status.innerText = `Memproses file ${i + 1} dari ${files.length}...`;
            let percent = Math.round(((i + 1) / files.length) * 100);
            progressBar.style.width = percent + "%";
            progressBar.innerText = percent + "%";

            try {
                const jsonData = await readFileAsync(files[i]);
                const filtered = jsonData.map(row => {
                    let newRow = {};
                    allowedColumns.forEach(col => {
                        let val = row[col] !== undefined ? row[col] : "";
                        newRow[col] = (col === "TglTransaksi") ? formatDate(val) : val;
                    });
                    return newRow;
                });
                allData = allData.concat(filtered);
            } catch (err) {
                console.error("Gagal membaca file:", files[i].name);
            }
            
            // Jeda singkat 10ms agar browser punya waktu untuk "bernapas" dan update UI
            await new Promise(resolve => setTimeout(resolve, 10));
        }

        if (allData.length > 0) {
            status.innerText = "Menghasilkan file Excel... Mohon tunggu.";
            setTimeout(() => {
                const ws = XLSX.utils.json_to_sheet(allData, { header: allowedColumns });
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "Combined");
                XLSX.writeFile(wb, "GABUNGAN_FINAL_" + Date.now() + ".xlsx");
                
                status.className = "mt-3 text-center small fw-bold text-success";
                status.innerText = "✅ Selesai! Total " + allData.length + " baris digabungkan.";
                btn.disabled = false;
            }, 100);
        }
    }

    function readFileAsync(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array', cellDates: true });
                const sheet = workbook.Sheets[workbook.SheetNames[0]];
                resolve(XLSX.utils.sheet_to_json(sheet));
            };
            reader.onerror = reject;
            reader.readAsArrayBuffer(file);
        });
    }
</script>
</body>
</html>
